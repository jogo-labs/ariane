name: Release

on:
  push:
    tags:
      - 'v*.*.*' # Déclenché sur les tags semver : v1.0.0, v2.3.1, etc.

jobs:
  release:
    name: Publish & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pour créer la GitHub Release
      id-token: write # Pour npm provenance (sécurité supply chain)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          # Pas de registry-url ici — l'auth se fait via OIDC Trusted Publishers (--provenance)

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Test (gate de sécurité avant publication)
        run: npm run test

      # Publier le package npm avec provenance via Trusted Publishers (OIDC, sans token).
      #
      # Logique de tagging :
      #   - version stable (sans suffixe pré-release) → tag "latest"
      #   - "-alpha.*" → tag "alpha"
      #   - "-beta.*"  → tag "beta"
      #
      # Cas spécial — phase pré-v1 :
      #   Tant qu'aucune version stable n'existe sur npm, les pré-releases sont
      #   publiées sous le tag "latest" afin que `npm install @ariane-ui/core`
      #   (sans @alpha / @beta) fonctionne. Dès la première stable publiée,
      #   ce cas ne s'applique plus et les pré-releases basculent sur leur tag
      #   propre — `npm install @ariane-ui/core` pointera alors sur la stable.
      #
      # Note : npm dist-tag add est incompatible avec OIDC Trusted Publishers
      # (E401). On détermine le tag en amont et on l'injecte directement dans
      # npm publish — un seul appel par release.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          PACKAGE_NAME="@ariane-ui/core"

          # Vérification robuste : npm view retourne une string si une seule version,
          # un array sinon — [].concat() normalise les deux cas.
          STABLE_EXISTS=$(npm view $PACKAGE_NAME versions --json 2>/dev/null | \
            node -e "
              const input = require('fs').readFileSync(0, 'utf8');
              if (!input) { console.log('no'); process.exit(0); }
              const v = [].concat(JSON.parse(input));
              console.log(v.some(x => !x.includes('-')) ? 'yes' : 'no');
            " || echo "no")

          if [[ "$VERSION" == *"-alpha"* ]]; then
            TAG="alpha"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi

          # Cas spécial pré-v1 : pas de stable → force latest pour la découvrabilité
          if [[ "$STABLE_EXISTS" == "no" && "$TAG" != "latest" ]]; then
            echo "No stable version found. Using 'latest' instead of '$TAG' to ensure discoverability."
            TAG="latest"
          fi

          echo "Publishing $VERSION with tag: $TAG"
          npm publish --workspace packages/core --access public --provenance --tag $TAG

      # Créer la GitHub Release avec le contenu du tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Déployer la doc (adapter selon ton hébergeur)
      # Exemple avec Vercel CLI :
      # - name: Deploy docs to Vercel
      #   run: npx vercel deploy apps/docs --prod --token=${{ secrets.VERCEL_TOKEN }}
